# Screenshot-test gate for every PR, on both platforms.
#
#  - verify (default): fail the PR on any unintended pixel change, upload diffs, comment on the PR.
#  - record: add the label `record-snapshots` to a PR (or run manually). CI re-records the goldens on
#    the pinned runner image and pushes them as a bot commit, so goldens never come from someone's
#    laptop. The resulting golden diff is then reviewed in the PR like any other code change.
#  - lint: every run fails if any golden is blank (a blank golden makes tests pass while protecting nothing).
#
# Versions checked against the actions' GitHub releases on 2026-11-05.
name: screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      record:
        description: "Re-record goldens instead of verifying"
        type: boolean
        default: false

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  RECORD: ${{ github.event.label.name == 'record-snapshots' || inputs.record == true }}
  # The pins goldens depend on. Bump them together with a re-baseline, in ONE reviewed PR.
  XCODE_MAJOR: "27"
  IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

jobs:
  lint-goldens:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - run: make lint-goldens

  ios:
    # Xcode 27 is only offered on the `xcode-27` preview image (macos-26 ships Xcode 26.x).
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write            # record mode pushes the re-recorded goldens back to the PR branch
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}
      - name: Select pinned Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Ensure pinned simulator runtime
        run: xcrun simctl list runtimes | grep -q "$IOS_RUNTIME" || xcodebuild -downloadPlatform iOS
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ios/NewsKit/.build
          key: spm-${{ hashFiles('ios/NewsKit/Package.resolved', 'ios/NewsKit/Package.swift') }}
      - name: Verify snapshots
        if: env.RECORD != 'true'
        run: make ios-test
      - name: Re-record snapshots
        if: env.RECORD == 'true'
        run: make ios-record || true   # record mode always "fails"; the golden diff is what gets reviewed
      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-snapshot-diffs
          path: artifacts/ios/diffs
      - name: Push re-recorded goldens
        if: env.RECORD == 'true'
        uses: ./.github/actions/commit-goldens
        with:
          paths: ios/NewsKit/Tests/NewsUISnapshotTests/__Snapshots__
          message: "chore(snapshots): re-record iOS goldens"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK 37 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Verify snapshots
        if: env.RECORD != 'true'
        run: make android-test
      - name: Re-record snapshots
        if: env.RECORD == 'true'
        run: make android-record
      - name: Upload diffs (_compare.png)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-snapshot-diffs
          path: android/app/build/outputs/roborazzi
      - name: Push re-recorded goldens
        if: env.RECORD == 'true'
        uses: ./.github/actions/commit-goldens
        with:
          paths: android/app/src/test/screenshots
          message: "chore(snapshots): re-record Android goldens"

  report:
    needs: [lint-goldens, ios, android]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: [
                '### 📸 Screenshot tests found visual changes',
                `Diff images (reference / actual / difference) are attached to [this run](${run}).`,
                '',
                '- **Unintended?** Fix the code and push.',
                '- **Intended?** Add the `record-snapshots` label. CI re-records the goldens and pushes them;',
                '  a designer/QA code-owner then approves the golden diff in this PR.',
              ].join('\n'),
            });
