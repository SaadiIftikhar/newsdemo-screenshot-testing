# Screenshot-test gate for every PR, on both platforms.
#
#  - verify (default): runs on the PR's MERGE result (what main will look like), fails on any unintended pixel
#    change, uploads a diff gallery and keeps ONE sticky PR comment up to date.
#  - record: add the label `record-snapshots` (or run manually). CI re-records on the pinned image, then proves
#    the new goldens (golden lint + a full verify run) BEFORE pushing them as a bot commit. Goldens never come
#    from someone's laptop. The golden diff is then reviewed in the PR (CODEOWNERS: design/QA).
#  - lint: every run fails if a golden is blank or iOS/Android golden names diverge.
#
# Push token: a push made with the default GITHUB_TOKEN does NOT start a new workflow run, so the re-recorded
# commit would never be verified and a required check would hang. Set the secret SNAPSHOT_BOT_TOKEN (a GitHub
# App / fine-grained token with contents:write) so the bot commit re-triggers this workflow.
#
# Branch protection to pair with it: require this check, require code-owner review, dismiss stale approvals.
# Action versions checked against their GitHub releases on 2026-11-05.
name: screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      record:
        description: "Re-record goldens instead of verifying"
        type: boolean
        default: false

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  RECORD: ${{ github.event.label.name == 'record-snapshots' || inputs.record == true }}
  # The pins goldens depend on. Bump them together with a re-baseline, in ONE reviewed PR.
  XCODE_MAJOR: "27"
  IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

jobs:
  lint-goldens:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - run: make lint-goldens

  ios:
    # Xcode 27 is only offered on the `xcode-27` preview image (macos-26 ships Xcode 26.x).
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: write            # record mode pushes the re-recorded goldens back to the PR branch
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          # verify: the default merge ref; record: the PR branch itself (that is where goldens are pushed)
          ref: ${{ env.RECORD == 'true' && github.head_ref || '' }}
          token: ${{ env.RECORD == 'true' && secrets.SNAPSHOT_BOT_TOKEN || github.token }}
      - name: Select pinned Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Ensure pinned simulator runtime
        run: xcrun simctl list runtimes | grep -q "$IOS_RUNTIME" || xcodebuild -downloadPlatform iOS
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ios/NewsKit/.build
          key: spm-${{ hashFiles('ios/NewsKit/Package.resolved', 'ios/NewsKit/Package.swift') }}
      - name: Verify snapshots + logic tests
        if: env.RECORD != 'true'
        run: make ios-test
      - name: UI interaction tests (XCUITest)
        if: env.RECORD != 'true'
        run: make ios-ui-test
      - name: Re-record, then prove the new goldens
        if: env.RECORD == 'true'
        run: |
          make ios-record || true      # record mode always reports "failed"
          make lint-goldens            # no blank goldens, names still match Android
          make ios-test                # the freshly recorded goldens must verify, or nothing is pushed
      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-snapshot-diffs
          path: artifacts/ios/diffs
      - name: Push re-recorded goldens
        if: env.RECORD == 'true'
        uses: ./.github/actions/commit-goldens
        with:
          paths: ios/NewsKit/Tests/NewsUISnapshotTests/__Snapshots__
          message: "chore(snapshots): re-record iOS goldens"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ env.RECORD == 'true' && github.head_ref || '' }}
          token: ${{ env.RECORD == 'true' && secrets.SNAPSHOT_BOT_TOKEN || github.token }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK 37 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Verify snapshots + logic + interaction tests
        if: env.RECORD != 'true'
        run: make android-test
      - name: Re-record, then prove the new goldens
        if: env.RECORD == 'true'
        run: |
          make android-record
          make android-test
      - name: Upload diffs (gallery + _compare.png)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-snapshot-diffs
          path: |
            artifacts/android/diffs
            android/app/build/outputs/roborazzi
      - name: Push re-recorded goldens
        if: env.RECORD == 'true'
        uses: ./.github/actions/commit-goldens
        with:
          paths: android/app/src/test/screenshots
          message: "chore(snapshots): re-record Android goldens"

  report:
    needs: [lint-goldens, ios, android]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            // ONE sticky comment, updated in place (it used to post a new comment on every failing push).
            const marker = '<!-- screenshot-report -->';
            const results = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(results).filter(([, r]) => r.result === 'failure').map(([job]) => job);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = failed.length === 0
              ? `${marker}\n### ✅ Screenshot tests passed\nAll goldens match on iOS and Android ([run](${run})).`
              : [
                  marker,
                  `### 📸 Screenshot tests found visual changes in: ${failed.join(', ')}`,
                  `Diff gallery (golden / this PR / changed pixels) is attached to [this run](${run}).`,
                  '',
                  '- **Unintended?** Fix the code and push.',
                  '- **Intended?** Add the `record-snapshots` label. CI re-records, verifies and pushes the goldens;',
                  '  a design/QA code owner then approves the golden diff in this PR.',
                ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else if (failed.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
